# Local SearXNG for Hermes web_search.
# use_default_settings keeps engine lists from the image; we only override
# what we need (JSON API + no public limiter for localhost use).
use_default_settings: true

server:
  # Local-only instance behind Docker — not exposed on the LAN.
  secret_key: "58fbfa47180a8363c2ef1cb9589c777f"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json
