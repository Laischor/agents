services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8317:8317"     # Anthropic-compatible API
      - "127.0.0.1:54545:54545"   # Codex / ChatGPT OAuth callback
    volumes:
      - ./data/cliproxy/config.yaml:/CLIProxyAPI/config.yaml
      - ./data/cliproxy/auths:/root/.cli-proxy-api

  # Opt-in: set HERMES=1 in .env (compose profile "hermes")
  # Terminal backend = docker → agents:local (claude / agent / pi available there).
  # AGENTS_DIR must be absolute in .env (start.sh / run.sh write it automatically).
  hermes:
    profiles: ["hermes"]
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    depends_on:
      - agents
    command: ["gateway", "run"]
    ports:
      - "127.0.0.1:8642:8642"     # gateway API / health
      - "127.0.0.1:9119:9119"     # web dashboard
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      HOST_PROJECTS: ${HOST_PROJECTS}
      AGENTS_DIR: ${AGENTS_DIR}
      HOST_HOME: ${HOME}
      # Drive host Docker from inside hermes (sandbox = agents:local)
      TERMINAL_ENV: docker
      TERMINAL_DOCKER_IMAGE: agents:local
      TERMINAL_DOCKER_MOUNT_CWD_TO_WORKSPACE: "true"
      TERMINAL_CONTAINER_PERSISTENT: "true"
      TERMINAL_DOCKER_FORWARD_ENV: '["CURSOR_API_KEY","ANTHROPIC_API_KEY","OPENAI_API_KEY","GOOGLE_API_KEY","CLAUDE_CONFIG_DIR","CAVEMAN_DEFAULT_MODE","CODEGRAPH_TELEMETRY","AGENTS_CLIPBOARD_DIR"]'
      TERMINAL_DOCKER_ENV: '{"CLAUDE_CONFIG_DIR":"/root/.claude","CODEGRAPH_TELEMETRY":"0","CAVEMAN_DEFAULT_MODE":"ultra","AGENTS_CLIPBOARD_DIR":"/var/agents-clipboard"}'
      # Host-absolute bind mounts (compose interpolates before the container sees them)
      TERMINAL_DOCKER_VOLUMES: '["${HOST_PROJECTS}:${HOST_PROJECTS}","${AGENTS_DIR}/data/claude:/root/.claude","${AGENTS_DIR}/data/cursor:/root/.cursor","${AGENTS_DIR}/data/cursor-config:/root/.config/cursor","${AGENTS_DIR}/data/pi:/root/.pi","${AGENTS_DIR}/data/clipboard:/var/agents-clipboard","${HOME}/.gitconfig:/root/.gitconfig:ro","${HOME}/.ssh:/root/.ssh:ro","${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"]'
    volumes:
      - ./data/hermes:/opt/data
      - ${HOST_PROJECTS}:${HOST_PROJECTS}
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock

  agents:
    build:
      context: .
      dockerfile: Dockerfile
    image: agents:local
    container_name: agents
    working_dir: ${HOST_PROJECTS}
    stdin_open: true
    tty: true
    depends_on:
      - cli-proxy-api
    environment:
      # Cursor CLI
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      # Pi / LLM providers (set what you use)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Keep Claude auth/config under one mounted dir (survives rebuild)
      CLAUDE_CONFIG_DIR: /root/.claude
      CODEGRAPH_TELEMETRY: "0"
      # Claude caveman SessionStart default (lite|full|ultra|…)
      CAVEMAN_DEFAULT_MODE: ultra
      # Host clipboard-bridge.sh → stubs (xclip/wl-paste) for screenshot paste
      AGENTS_CLIPBOARD_DIR: /var/agents-clipboard
    volumes:
      # Same path as host so compose bind mounts resolve correctly
      - ${HOST_PROJECTS}:${HOST_PROJECTS}
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # Host identity for git commits + GitHub SSH
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
      - ${HOME}/.ssh:/root/.ssh:ro
      # Persist configs on the host (survive rebuild / down -v)
      - ./data/cursor:/root/.cursor
      # Cursor CLI stores OAuth tokens here on Linux (not under ~/.cursor)
      - ./data/cursor-config:/root/.config/cursor
      - ./data/pi:/root/.pi
      - ./data/claude:/root/.claude
      # macOS clipboard bridge drop dir (PNG for Claude Ctrl+V paste)
      - ./data/clipboard:/var/agents-clipboard
    # Keep the container running for interactive exec
    command: ["sleep", "infinity"]
