services:
  # Opt-in: set HERMES=1 in .env (compose profile "hermes")
  # Terminal backend = docker → agents:local (claude / agent / pi / opencode available there).
  # AGENTS_DIR must be absolute in .env (start.sh / run.sh write it automatically).
  # Gateway+dashboard (:9119) for config/ops; Open WebUI (:3000) for chat.
  hermes:
    profiles: ["hermes"]
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    # Do NOT depends_on agents — recreating hermes would restart agents and kill
    # live Cursor/Claude sessions. Sandbox only needs the agents:local image + socket.
    depends_on:
      - searxng
    command: ["gateway", "run"]
    ports:
      - "127.0.0.1:8642:8642"     # gateway API / health
      - "127.0.0.1:9119:9119"     # web dashboard (config / monitoring)
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET:-}
      # OpenAI-compatible API on :8642 — Open WebUI routes chat through this
      # gateway (tools/sandbox stay here, not in open-webui).
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      # Compose-network URL — Hermes web_search backend (search_backend: searxng)
      # Also persisted in data/hermes/.env so get_env_value sees it.
      SEARXNG_URL: http://searxng:8080
      # macOS: gh stores OAuth in Keychain — start.sh/run.sh inject via `gh auth token`.
      # Hermes Skills Hub / github-auth read GITHUB_TOKEN (GH_TOKEN is the gh CLI name).
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HOST_PROJECTS: ${HOST_PROJECTS}
      AGENTS_DIR: ${AGENTS_DIR}
      HOST_HOME: ${HOME}
      # Image default is /opt/data only — also allow write_file/patch under mounted projects
      HERMES_WRITE_SAFE_ROOT: /opt/data:/tmp:${HOST_PROJECTS}
      # Non-root UID for data/hermes bind mount. On macOS use your host id (often 501);
      # start.sh writes HERMES_UID/GID if unset.
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      # Drive host Docker from inside hermes (sandbox = agents:local)
      TERMINAL_ENV: docker
      TERMINAL_DOCKER_IMAGE: agents:local
      TERMINAL_DOCKER_MOUNT_CWD_TO_WORKSPACE: "true"
      TERMINAL_CONTAINER_PERSISTENT: "true"
      TERMINAL_DOCKER_FORWARD_ENV: '["CURSOR_API_KEY","ANTHROPIC_API_KEY","OPENAI_API_KEY","GOOGLE_API_KEY","GH_TOKEN","GITHUB_TOKEN","CLAUDE_CONFIG_DIR","CAVEMAN_DEFAULT_MODE","CODEGRAPH_TELEMETRY","AGENTS_CLIPBOARD_DIR","AGENTS_GPU_DIR","AGENTS_CMUX_DIR","HOST_PROJECTS","CMUX_WORKSPACE_ID","CMUX_SURFACE_ID","CMUX_TAB_ID","CMUX_WINDOW_ID","SEARXNG_URL"]'
      # DISPLAY=:0 → Cursor CLI will call xclip stubs (no real X11 needed)
      TERMINAL_DOCKER_ENV: '{"CLAUDE_CONFIG_DIR":"/root/.claude","CODEGRAPH_TELEMETRY":"0","CAVEMAN_DEFAULT_MODE":"ultra","AGENTS_CLIPBOARD_DIR":"/var/agents-clipboard","AGENTS_GPU_DIR":"/var/agents-gpu","AGENTS_CMUX_DIR":"/var/agents-cmux","DISPLAY":":0"}'
      # Host-absolute bind mounts (compose interpolates before the container sees them)
      TERMINAL_DOCKER_VOLUMES: '["${HOST_PROJECTS}:${HOST_PROJECTS}","${AGENTS_DIR}/data/claude:/root/.claude","${AGENTS_DIR}/data/cursor:/root/.cursor","${AGENTS_DIR}/data/cursor-config:/root/.config/cursor","${AGENTS_DIR}/data/pi:/root/.pi","${AGENTS_DIR}/data/opencode:/root/.local/share/opencode","${AGENTS_DIR}/data/opencode-config:/root/.config/opencode","${AGENTS_DIR}/data/clipboard:/var/agents-clipboard","${AGENTS_DIR}/data/gpu:/var/agents-gpu","${AGENTS_DIR}/data/cmux:/var/agents-cmux","${AGENTS_DIR}/data/gitconfig:/root/.gitconfig:ro","${AGENTS_DIR}/data/gh:/root/.config/gh:ro","${HOME}/.ssh:/root/.ssh:ro","${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"]'
    volumes:
      - ./data/hermes:/opt/data
      - ${HOST_PROJECTS}:${HOST_PROJECTS}
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # Linux gh config with oauth_token (host ~/.config/gh has none — Keychain).
      # Not under home/: stage2 recursively chowns that tree.
      - ./data/gh:/opt/data/.config/gh:ro
      - ./data/gitconfig:/opt/data/.gitconfig:ro

  # Open WebUI as chat frontend. Talks to Hermes' OpenAI-compatible API
  # (http://hermes:8642/v1) so tools/memory/cron/Docker sandbox stay on the
  # gateway — Open WebUI is only the browser UI, not a second agent.
  # Dashboard stays on :9119 for config; use :3000 for webchat.
  # Official guide: https://hermes-agent.nousresearch.com/docs/user-guide/messaging/open-webui
  open-webui:
    profiles: ["hermes"]
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - hermes
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      # Same compose network — no host.docker.internal needed
      OPENAI_API_BASE_URL: http://hermes:8642/v1
      OPENAI_API_KEY: ${HERMES_API_SERVER_KEY:-}
      # Suppress empty default Ollama backend in the model picker
      ENABLE_OLLAMA_API: "false"
      # No login — Open WebUI is only reachable via localhost / Tailscale
      WEBUI_AUTH: "false"
    volumes:
      - ./data/open-webui:/app/backend/data

  # Metasearch for Hermes web_search — JSON enabled via config/searxng/settings.yml.
  # Same compose profile as hermes (HERMES=1 / --profile hermes).
  searxng:
    profiles: ["hermes"]
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"   # host curl / browser smoke-test
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

  agents:
    build:
      context: .
      dockerfile: Dockerfile
    image: agents:local
    container_name: agents
    working_dir: ${HOST_PROJECTS}
    stdin_open: true
    tty: true
    # tini as PID 1 — reap zombies from dead MCP/agent children
    init: true
    # Hard cap so thrash/OOM cannot freeze the whole long-lived container
    # Override via AGENTS_MEM_LIMIT in .env (e.g. 4g, 6g)
    mem_limit: ${AGENTS_MEM_LIMIT:-3g}
    ports:
      - "127.0.0.1:4096:4096"   # OpenCode serve/web (binds 0.0.0.0:4096 in-container)
    environment:
      # Cursor CLI
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      # Pi / LLM providers (set what you use)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # GitHub CLI — Keychain on macOS is not visible in Linux; inject at compose time
      GH_TOKEN: ${GH_TOKEN:-}
      # Keep Claude auth/config under one mounted dir (survives rebuild)
      CLAUDE_CONFIG_DIR: /root/.claude
      CODEGRAPH_TELEMETRY: "0"
      # Claude caveman SessionStart default (lite|full|ultra|…)
      CAVEMAN_DEFAULT_MODE: ultra
      # Host clipboard-bridge.sh → stubs (xclip/wl-paste) for screenshot paste
      AGENTS_CLIPBOARD_DIR: /var/agents-clipboard
      # Host gpu-bridge.sh → blender/godot shims (Metal on macOS)
      AGENTS_GPU_DIR: /var/agents-gpu
      # Host cmux-bridge.sh → cmux stub (notifications / sounds)
      AGENTS_CMUX_DIR: /var/agents-cmux
      # Dummy display so Cursor CLI enables linux clipboard image paste (xclip stubs)
      DISPLAY: ":0"
    volumes:
      # Same path as host so compose bind mounts resolve correctly
      - ${HOST_PROJECTS}:${HOST_PROJECTS}
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # Host identity for git commits + GitHub SSH / gh CLI
      # Identity only — credential helper + safe.directory live in /etc/gitconfig
      - ${HOME}/.gitconfig:/etc/gitconfig.host:ro
      - ${HOME}/.ssh:/root/.ssh:ro
      - ./data/gh:/root/.config/gh:ro
      # Persist configs on the host (survive rebuild / down -v)
      - ./data/cursor:/root/.cursor
      # Cursor CLI stores OAuth tokens here on Linux (not under ~/.cursor)
      - ./data/cursor-config:/root/.config/cursor
      - ./data/pi:/root/.pi
      - ./data/claude:/root/.claude
      # OpenCode auth/sessions + global config (survive rebuild)
      - ./data/opencode:/root/.local/share/opencode
      - ./data/opencode-config:/root/.config/opencode
      # macOS clipboard bridge drop dir (PNG for Claude/Cursor/OpenCode Ctrl+V paste)
      - ./data/clipboard:/var/agents-clipboard
      # macOS GPU job queue (Blender/Godot via gpu-bridge.sh)
      - ./data/gpu:/var/agents-gpu
      # macOS cmux notification queue (cmux-bridge.sh)
      - ./data/cmux:/var/agents-cmux
    # Keep the container running for interactive exec
    command: ["sleep", "infinity"]
