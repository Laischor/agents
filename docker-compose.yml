services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-api
    restart: unless-stopped
    ports:
      - "8317:8317"       # Anthropic-compatible API
      - "54545:54545"     # Codex / ChatGPT OAuth callback
    volumes:
      - ./data/cliproxy/config.yaml:/CLIProxyAPI/config.yaml
      - ./data/cliproxy/auths:/root/.cli-proxy-api

  # Opt-in: set HERMES=1 in .env (compose profile "hermes")
  hermes:
    profiles: ["hermes"]
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    ports:
      - "8642:8642"       # gateway API / health
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - ./data/hermes:/opt/data
      - ${HOST_PROJECTS}:${HOST_PROJECTS}
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock

  agents:
    build:
      context: .
      dockerfile: Dockerfile
    image: agents:local
    container_name: agents
    working_dir: ${HOST_PROJECTS}
    stdin_open: true
    tty: true
    depends_on:
      - cli-proxy-api
    environment:
      # Cursor CLI
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      # Pi / LLM providers (set what you use)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Keep Claude auth/config under one mounted dir (survives rebuild)
      CLAUDE_CONFIG_DIR: /root/.claude
      CODEGRAPH_TELEMETRY: "0"
      # Claude caveman SessionStart default (lite|full|ultra|…)
      CAVEMAN_DEFAULT_MODE: ultra
    volumes:
      # Same path as host so compose bind mounts resolve correctly
      - ${HOST_PROJECTS}:${HOST_PROJECTS}
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # Host identity for git commits + GitHub SSH
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
      - ${HOME}/.ssh:/root/.ssh:ro
      # Persist configs on the host (survive rebuild / down -v)
      - ./data/cursor:/root/.cursor
      # Cursor CLI stores OAuth tokens here on Linux (not under ~/.cursor)
      - ./data/cursor-config:/root/.config/cursor
      - ./data/pi:/root/.pi
      - ./data/claude:/root/.claude
    # Keep the container running for interactive exec
    command: ["sleep", "infinity"]
