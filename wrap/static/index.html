<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>wrap — native sessions</title>
  <link rel="stylesheet" href="/static/style.css?v=30" />
</head>
<body>
  <div id="scrim" hidden></div>
  <aside id="sidebar">
    <header class="brand">
      <div class="mark">w</div>
      <div>
        <strong>wrap</strong>
        <span>native sessions</span>
      </div>
    </header>
    <h2>Sessions <button type="button" id="btn-new" class="ghost tiny">New</button></h2>
    <div id="search-row">
      <input id="search" type="search" placeholder="Search sessions…" autocomplete="off" />
      <button type="button" id="btn-filter" class="ghost" aria-label="Filter agents" aria-haspopup="true" aria-expanded="false" aria-controls="agent-filter" title="Filter by agent">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M1.6 2.2h12.8l-4.6 5.6v4.4L6.2 14V7.8L1.6 2.2z"/></svg>
      </button>
      <div id="agent-filter" hidden></div>
    </div>
    <div id="lists">
      <ul id="sessions"></ul>
      <h2 id="closed-head" hidden>Closed</h2>
      <ul id="closed" hidden></ul>
    </div>
    <footer id="health"></footer>
  </aside>
  <main>
    <header id="mobile-bar">
      <button type="button" id="btn-menu" class="ghost" aria-label="Sessions" aria-controls="sidebar" aria-expanded="false">Sessions</button>
      <strong id="mobile-title">wrap</strong>
    </header>
    <div id="session-bar" hidden>
      <label>Project
        <select id="project"></select>
      </label>
      <label>Agent
        <select id="agent">
          <option value="claude">Claude</option>
          <option value="cursor">Cursor</option>
          <option value="opencode">OpenCode</option>
        </select>
      </label>
      <label>Model
        <select id="model"></select>
      </label>
      <label>Effort
        <select id="effort"></select>
      </label>
      <label class="check" id="fast-wrap" hidden>
        <input type="checkbox" id="fast" />
        Fast
      </label>
    </div>
    <div id="chat">
      <section id="log" class="log"></section>
      <div id="tui" hidden>
        <header>
          <strong>TUI</strong>
          <span>type or paste a screenshot — keys go to the CLI</span>
          <button type="button" id="btn-tui-close" class="ghost tiny">Close</button>
        </header>
        <pre id="pane" tabindex="0"></pre>
      </div>
    </div>
    <p id="status" hidden></p>
    <form id="composer">
      <div id="attach" hidden></div>
      <textarea id="input" rows="2" placeholder="Message the native CLI…" disabled></textarea>
      <div class="row">
        <div class="actions">
          <button type="button" id="btn-pane" class="ghost" hidden>TUI</button>
          <button type="button" id="btn-int" class="ghost" hidden>Interrupt</button>
          <button type="button" id="btn-clear" class="ghost" hidden title="Stop this session and start a new one with the same project, agent, and model">Clear</button>
          <button type="button" id="btn-stop" class="ghost danger" hidden>Stop</button>
        </div>
        <button type="submit" id="btn-send" disabled>Send</button>
      </div>
    </form>
  </main>
  <script src="/static/app.js?v=30"></script>
</body>
</html>
